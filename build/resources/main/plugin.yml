name: GalerkaAuthPlugin
version: '1.0-SNAPSHOT'
main: org.justiks.galerkaAuthPlugin.GalerkaAuthPlugin
api-version: '26.2'
load: POSTWORLD
description: Плагин авторизации с SQLite и хешированием паролей

commands:
  reg:
    description: Регистрация аккаунта
    usage: /reg <пароль> <повтор пароля>
    aliases: [register]
  login:
    description: Вход в аккаунт
    usage: /login <пароль>
    aliases: [l]
  changepassword:
    description: Смена пароля
    usage: /changepassword <старый> <новый> <повтор>
    aliases: [changepass, cp]
  logout:
    description: Выход из аккаунта
    usage: /logout
  unregister:
    description: Удаление аккаунта игрока
    usage: /unregister <ник>

permissions:
  galerkaauth.bypass:
    description: Обход авторизации
    default: op
  galerkaauth.admin.unregister:
    description: Удаление аккаунтов игроков
    default: op
  galerkaauth.*:
    description: Все права плагина
    default: op
    children:
      galerkaauth.bypass: true
      galerkaauth.admin.unregister: true
