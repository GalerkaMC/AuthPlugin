settings:
  min-password-length: 6
  max-password-length: 32
  max-login-attempts: 5
  ip-session-enabled: true
  require-same-ip-for-session: true
  session-duration-minutes: 30

two-factor:
  enabled: true
  authbot-base-url: "http://localhost:8000"
  request-timeout-seconds: 10

rest-api:
  enabled: true
  host: "127.0.0.1"
  port: 8080

